name: Lock + autofix

# One-off, manually triggered: regenerates uv.lock and applies ruff fixes on a
# runner (the local machine has neither uv nor ruff), committing both back.
# Removed again once the tree is clean.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock
      - run: uv sync --frozen
      - run: uv run ruff check --fix app tests
      - run: uv run ruff format app tests
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (
            git add -A
            git commit -m "chore: regenerate uv.lock; apply ruff fixes"
            git push
          )
