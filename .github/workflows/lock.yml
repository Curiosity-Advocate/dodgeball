name: Generate lockfile

# One-off, manually triggered: generates uv.lock on a runner and commits it
# back, because the local machine has neither uv nor Docker. Delete after use.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: add uv.lock (generated in CI)"
          git push
