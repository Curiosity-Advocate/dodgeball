[project]
name = "dodgeballplus"
version = "0.1.0"
description = "Live scoring platform for dodgeball"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "import-linter>=2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on Depends() in argument defaults (B008).
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

# ---- architecture contracts ----
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core is independent"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.events",
    "app.auth",
    "app.scoring",
    "app.delivery",
    "app.read",
    "app.management",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "nothing imports api"
type = "forbidden"
source_modules = [
    "app.core",
    "app.events",
    "app.auth",
    "app.scoring",
    "app.delivery",
    "app.read",
    "app.management",
]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "write/fan-out decoupling"
type = "independence"
modules = ["app.scoring", "app.delivery"]

[[tool.importlinter.contracts]]
name = "event log is encapsulated (only scoring + api may use events)"
type = "forbidden"
source_modules = ["app.auth", "app.read", "app.delivery"]
forbidden_modules = ["app.events"]
