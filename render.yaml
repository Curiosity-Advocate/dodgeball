# DodgeballPlus runs only its web service on Render; Postgres is hosted on Neon
# (Render's free tier allows one database per account, kept for another project).
services:
  - type: web
    name: dodgeball
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # set in the dashboard to the Neon connection string
      - key: JWT_SECRET
        generateValue: true
