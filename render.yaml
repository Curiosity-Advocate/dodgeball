databases:
  - name: dodgeball-db
    databaseName: dodgeball
    plan: free
    region: singapore

services:
  - type: web
    name: dodgeball
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dodgeball-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
